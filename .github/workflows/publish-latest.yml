name: Build and publish converted rules

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish all converted rule files to the latest release"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: publish-latest-rules
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build rule files and update release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Download rules.json
        run: |
          curl -fsSL \
            "https://gist.githubusercontent.com/chenxiex/31268f8af084349c2cf684164756d41d/raw/rules.json" \
            -o rules.json

      - name: Generate release files
        run: |
          mkdir -p release
          python rules-converter.py rules.json release/simple-switchy.sorl \
            --from-format xray \
            --to-format simple-switchy
          python rules-converter.py rules.json release \
            --from-format xray \
            --to-format clash

      - name: Upload converted rules for non-release runs
        if: (github.event_name == 'push' && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish_release != true)
        uses: actions/upload-artifact@v7
        with:
          name: converted-rules-${{ github.ref_name }}-${{ github.sha }}
          path: release/*
          if-no-files-found: error

      - name: Update latest tag
        if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        run: |
          git tag -f latest
          git push origin refs/tags/latest --force

      - name: Create or update latest rules release
        if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest > /dev/null 2>&1; then
            gh release edit latest \
              --title "Latest converted rules" \
              --notes "Automatically updated rule files in simple-switchy and clash formats. Updated on $(date -u +'%Y-%m-%d %H:%M:%S UTC')."
          else
            gh release create latest \
              --title "Latest converted rules" \
              --notes "Automatically generated rule files in simple-switchy and clash formats. Created on $(date -u +'%Y-%m-%d %H:%M:%S UTC')."
          fi

      - name: Upload rule files to release
        if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload latest release/* --clobber
